version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+09:00


  ai-engine:
    build: ../ai-engine
    container_name: ai-engine
    restart: always
    env_file:
      - .env
    expose:
      - "8000"

  orchestrator:
    build: ../orchestrator
    container_name: orchestrator
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      ai-engine:
        condition: service_started
    env_file:
      - .env
    ports:
      - "${ORCH_PORT}:8080"

volumes:
  mysql_data: